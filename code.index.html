<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Flash Training Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0f;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Эффект встряски экрана при Черной вспышке */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-10px, 10px) rotate(-2deg); }
            40% { transform: translate(10px, -10px) rotate(2deg); }
            60% { transform: translate(-5px, 5px) rotate(-1deg); }
            80% { transform: translate(5px, -5px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }

        /* Вспышка экрана */
        @keyframes flash-bg {
            0% { background-color: #0b0b0f; }
            30% { background-color: #ff0055; }
            60% { background-color: #11001c; }
            100% { background-color: #0b0b0f; }
        }
        .flash-effect {
            animation: flash-bg 0.4s ease-out;
        }

        /* Шапка с очками и статами */
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 15, 25, 0.8);
            border-bottom: 1px solid #222;
            z-index: 10;
        }
        .stat-box {
            text-align: center;
        }
        .stat-value {
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
        }
        .stat-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
        }

        /* Зона арены с манекеном */
        .arena {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .curse-container {
            position: relative;
            text-align: center;
            transition: transform 0.1s;
        }

        .curse-avatar {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #221133 0%, #0d0614 70%);
            border: 3px solid #ff0055;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.3);
            margin-bottom: 15px;
            position: relative;
        }

        .curse-face {
            font-size: 50px;
            filter: drop-shadow(0 0 10px #ff0055);
        }

        /* Полоска здоровья проклятия */
        .hp-bar-container {
            width: 200px;
            height: 10px;
            background: #222;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #444;
            margin: 0 auto;
        }
        .hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #ffcc00);
            transition: width 0.2s ease;
        }

        /* Текстовые уведомления (Black Flash / Обычный удар) */
        #feedback-text {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            min-height: 40px;
            margin-top: 15px;
            text-align: center;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        /* Панель управления и тайминга */
        .control-panel {
            padding: 20px 20px 40px 20px;
            background: rgba(15, 15, 25, 0.9);
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-top: 1px solid #222;
            z-index: 10;
        }

        /* Тайминг-бар (шкала концентрации) */
        .timing-bar-container {
            width: 100%;
            height: 24px;
            background: #151520;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
            display: none; /* Показывается во время удара */
        }

        .timing-target {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 45%;
            width: 10%;
            background: rgba(0, 255, 204, 0.4);
            border-left: 2px solid #00ffcc;
            border-right: 2px solid #00ffcc;
        }

        .timing-cursor {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #fff;
            box-shadow: 0 0 8px #fff;
            left: 0;
        }

        /* Главная кнопка */
        .action-btn {
            width: 100%;
            padding: 22px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff0055 0%, #aa0033 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.4);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            letter-spacing: 1px;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .action-btn.ready-spark {
            background: linear-gradient(135deg, #00ffcc 0%, #008866 100%);
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.4);
            color: #0b0b0f;
        }

        .zone-indicator {
            text-align: center;
            font-size: 13px;
            color: #00ffcc;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            min-height: 18px;
        }
    </style>
</head>
<body id="body">

    <div class="header">
        <div class="stat-box">
            <div class="stat-value" id="score">0</div>
            <div class="stat-label">Очки урона</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="streak">0</div>
            <div class="stat-label">Серия (Зона)</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="record">0</div>
            <div class="stat-label">Рекорд серии</div>
        </div>
    </div>

    <div class="arena" id="arena">
        <div class="curse-container" id="curseContainer">
            <div class="curse-avatar">
                <div class="curse-face">👺</div>
            </div>
            <div class="hp-bar-container">
                <div class="hp-bar-fill" id="hpFill"></div>
            </div>
        </div>
        <div id="feedback-text">НАЧНИ ТРЕНИРОВКУ</div>
    </div>

    <div class="control-panel">
        <div class="zone-indicator" id="zoneStatus">СОСТОЯНИЕ ПОТОКА: НЕАКТИВНО</div>
        
        <!-- Шкала тайминга появляется во время удара -->
        <div class="timing-bar-container" id="timingBar">
            <div class="timing-target" id="timingTarget"></div>
            <div class="timing-cursor" id="timingCursor"></div>
        </div>

        <button class="action-btn" id="actionBtn" onclick="handleActionButton()">УДАР / ПРОКЛЯТАЯ ЭНЕРГИЯ</button>
    </div>

    <script>
        let gameState = 'IDLE'; // IDLE, CHARGING, WAITING_SPARK
        let score = 0;
        let streak = 0;
        let maxStreak = 0;
        let curseHp = 100;
        
        // Параметры тайминга
        let cursorPosition = 0; // от 0 до 100%
        let cursorDirection = 1;
        let cursorSpeed = 2.5; // Скорость ползунка
        let animationFrameId = null;

        const body = document.getElementById('body');
        const arena = document.getElementById('arena');
        const actionBtn = document.getElementById('actionBtn');
        const timingBar = document.getElementById('timingBar');
        const timingCursor = document.getElementById('timingCursor');
        const timingTarget = document.getElementById('timingTarget');
        const feedbackText = document.getElementById('feedback-text');
        const scoreEl = document.getElementById('score');
        const streakEl = document.getElementById('streak');
        const recordEl = document.getElementById('record');
        const zoneStatus = document.getElementById('zoneStatus');
        const hpFill = document.getElementById('hpFill');
        const curseContainer = document.getElementById('curseContainer');

        function handleActionButton() {
            if (gameState === 'IDLE' || gameState === 'RESETTING') {
                startStrike();
            } else if (gameState === 'WAITING_SPARK') {
                applySparkTiming();
            }
        }

        function startStrike() {
            gameState = 'WAITING_SPARK';
            actionBtn.textContent = "ВЛИТЬ ЭНЕРГИЮ!";
            actionBtn.classList.add('ready-spark');
            feedbackText.textContent = "ЗАМАХ... ЖДИ МОМЕНТ!";
            feedbackText.style.color = "#ffcc00";
            
            timingBar.style.display = 'block';
            
            // Динамическая ширина зоны блэкфлэша сужается при серии или становится чуть шире в «Зоне»
            let targetWidth = Math.max(6, 12 - (streak * 0.5)); 
            let targetLeft = 35 + Math.random() * 30; // Случайное положение зоны
            timingTarget.style.left = targetLeft + '%';
            timingTarget.style.width = targetWidth + '%';
            
            // Скорость растет с серией
            cursorSpeed = 2.2 + (streak * 0.3);
            cursorPosition = Math.random() < 0.5 ? 0 : 100;
            cursorDirection = cursorPosition === 0 ? 1 : -1;

            cancelAnimationFrame(animationFrameId);
            animateCursor();
        }

        function animateCursor() {
            if (gameState !== 'WAITING_SPARK') return;

            cursorPosition += cursorSpeed * cursorDirection;
            if (cursorPosition >= 100) {
                cursorPosition = 100;
                cursorDirection = -1;
            } else if (cursorPosition <= 0) {
                cursorPosition = 0;
                cursorDirection = 1;
            }

            timingCursor.style.left = cursorPosition + '%';
            animationFrameId = requestAnimationFrame(animateCursor);
        }

        function applySparkTiming() {
            cancelAnimationFrame(animationFrameId);
            timingBar.style.display = 'none';

            // Получаем координаты цели и курсора
            let targetLeft = parseFloat(timingTarget.style.left);
            let targetWidth = parseFloat(timingTarget.style.width);
            let targetRight = targetLeft + targetWidth;

            let hitOk = (cursorPosition >= targetLeft && cursorPosition <= targetRight);

            if (hitOk) {
                // БЭК ФЛЭШ! (Black Flash)
                triggerBlackFlashEffects();
            } else {
                // Обычный удар (мимо микро-окна)
                triggerNormalHit();
            }

            resetTurn();
        }

        function triggerBlackFlash() {
            // Реализация логики Black Flash
        }

        function triggerBlackFlashEffects() {
            streak++;
            if (streak > maxStreak) maxStreak = streak;

            // Множитель степени 2.5 (базовый урон 100)
            let damage = Math.round(100 * Math.pow(1.5, streak));
            score += damage;

            feedbackText.textContent = "⚡ BLACK FLASH! (ЧЁРНАЯ ВСПЫШКА) ⚡";
            feedbackText.style.color = "#00ffcc";
            
            body.classList.add('flash-effect');
            arena.classList.add('shake');

            if (streak >= 2) {
                zoneStatus.textContent = `🔥 СОСТОЯНИЕ ПОТОКА (УРОВЕНЬ ${streak}) 🔥`;
            }

            updateStats();
            damageCurse(damage);

            setTimeout(() => {
                body.classList.remove('flash-effect');
                arena.classList.remove('shake');
            }, 400);
        }

        function triggerNormalHit() {
            streak = 0;
            let damage = 25;
            score += damage;

            feedbackText.textContent = "ОБЫЧНЫЙ УДАР (ПРОМАХ ПО ТАЙМИНГУ)";
            feedbackText.style.color = "#ff5555";
            zoneStatus.textContent = "СОСТОЯНИЕ ПОТОКА: СБИТО";

            updateStats();
            damageCurse(damage);
        }

        function damageCurse(dmg) {
            curseHp -= (dmg / 25);
            if (curseHp <= 0) {
                curseHp = 100;
                feedbackText.textContent = "ПРОКЛЯТИЕ ИЗБИТО И ВОССТАНОВИЛОСЬ!";
            }
            hpFill.style.width = curseHp + '%';
        }

        function updateStats() {
            scoreEl.textContent = score;
            streakEl.textContent = streak;
            recordEl.textContent = maxStreak;
        }

        function resetTurn() {
            gameState = 'IDLE';
            actionBtn.textContent = "УДАР / ПРОКЛЯТАЯ ЭНЕРГИЯ";
            actionBtn.classList.remove('ready-spark');
        }
    </script>
</body>
</html>
